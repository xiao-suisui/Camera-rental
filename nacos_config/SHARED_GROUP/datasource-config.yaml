spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/camera_rental?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=30000}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:123456}

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 10000
      time-between-eviction-runs-millis: 10000
      min-evictable-idle-time-millis: 30000
      max-evictable-idle-time-millis: 120000
      validation-query: SELECT 1
      validation-query-timeout: 5000
      test-while-idle: true
      test-on-borrow: false  # 核心优化
      keep-alive: true
      remove-abandoned: true
      remove-abandoned-timeout-millis: 300000
      log-abandoned: true
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      
      # 监控过滤
      web-stat-filter:
        enabled: ${DRUID_WEB_STAT_ENABLED:false}
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      
      # 监控页面（默认关闭，生产安全）
      stat-view-servlet:
        enabled: ${DRUID_STAT_VIEW_ENABLED:false}
        url-pattern: /druid/*
        reset-enable: false
        login-username: ${DRUID_USERNAME}
        login-password: ${DRUID_PASSWORD}
        allow: ${DRUID_ALLOW_IP:127.0.0.1}