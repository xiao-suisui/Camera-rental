# 通用配置，所有服务共享
spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# 通用日志配置
logging:
  level:
    root: INFO
    org.springframework: INFO
    com.alibaba.nacos: WARN
  file:
    path: ${LOG_PATH:/var/logs/camera-rental}
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Actuator 端点配置
management:
  endpoints:
    web:
      exposure:
        # 统一暴露到服务本地，由网关按IP策略控制外网仅health、内网health/info/metrics
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

