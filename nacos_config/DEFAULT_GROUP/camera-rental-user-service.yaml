server:
  port: 8081

spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
        port: 8719
      eager: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.example.camerarental.user.entity

# JWT配置（加密存储）
jwt:
  secret: ${JWT_SECRET}
  issuer: camera-rental
  expiration-minutes: 120

logging:
  level:
    com.example.camerarental: warn
    com.baomidou.mybatisplus: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI 文档配置
springdoc:
  api-docs:
    enabled: true
  packages-to-scan: com.example.camerarental.user.controller
