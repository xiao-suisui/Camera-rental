version: '3.8'

# ============================================================
# Camera Rental — Docker Compose (Production)
# 使用方式：
#   1. cd service && mvn clean package -DskipTests
#   2. cp .env.example .env  → 填入真实密码
#   3. docker-compose up -d
# ============================================================

services:

  # ==================== 基础设施 ====================

  mysql:
    image: mysql:8.0
    container_name: camera-rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: camera_rental
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max-connections=500
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - camera-rental-network

  redis:
    image: redis:7-alpine
    container_name: camera-rental-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --notify-keyspace-events Ex
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - camera-rental-network

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: camera-rental-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - JVM_XMS=256m
      - JVM_XMX=512m
      - TZ=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:-nacos-server}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:-camera-rental}
    ports:
      - "127.0.0.1:8848:8848"
      - "127.0.0.1:9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - camera-rental-network

  sentinel:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: camera-rental-sentinel
    restart: unless-stopped
    ports:
      - "8858:8858"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - camera-rental-network

  minio:
    image: minio/minio:latest
    container_name: camera-rental-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - camera-rental-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: camera-rental-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/camera-rental}
      TZ: Asia/Shanghai
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - camera-rental-network

  # ==================== 前端（Nginx 托管） ====================

  frontend:
    image: nginx:alpine
    container_name: camera-rental-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    networks:
      - camera-rental-network

  # ==================== 微服务 ====================

  gateway:
    build:
      context: ./camera-rental-gateway
      dockerfile: Dockerfile
    container_name: camera-rental-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - SENTINEL_DASHBOARD=sentinel:8858
      - CAMERA_RENTAL_JWT_SECRET=${CAMERA_RENTAL_JWT_SECRET}
      - CAMERA_RENTAL_RABBITMQ_USER=${CAMERA_RENTAL_RABBITMQ_USER}
      - CAMERA_RENTAL_RABBITMQ_PASSWORD=${CAMERA_RENTAL_RABBITMQ_PASSWORD}
      - CAMERA_RENTAL_REDIS_PASSWORD=${CAMERA_RENTAL_REDIS_PASSWORD}
      - GATEWAY_CORS_ALLOWED_ORIGIN=${GATEWAY_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      - GATEWAY_INTERNAL_IP_WHITELIST=${GATEWAY_INTERNAL_IP_WHITELIST:-127.0.0.1,::1}
      - TZ=Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - camera-rental-network

  user-service:
    build:
      context: ./camera-rental-user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - SENTINEL_DASHBOARD=sentinel:8858
      - CAMERA_RENTAL_DB_PASSWORD=${CAMERA_RENTAL_DB_PASSWORD}
      - CAMERA_RENTAL_JWT_SECRET=${CAMERA_RENTAL_JWT_SECRET}
      - CAMERA_RENTAL_RABBITMQ_USER=${CAMERA_RENTAL_RABBITMQ_USER}
      - CAMERA_RENTAL_RABBITMQ_PASSWORD=${CAMERA_RENTAL_RABBITMQ_PASSWORD}
      - CAMERA_RENTAL_MINIO_ACCESS_KEY=${CAMERA_RENTAL_MINIO_ACCESS_KEY}
      - CAMERA_RENTAL_MINIO_SECRET_KEY=${CAMERA_RENTAL_MINIO_SECRET_KEY}
      - CAMERA_RENTAL_REDIS_PASSWORD=${CAMERA_RENTAL_REDIS_PASSWORD}
      - CAMERA_RENTAL_DRUID_USERNAME=${CAMERA_RENTAL_DRUID_USERNAME}
      - CAMERA_RENTAL_DRUID_PASSWORD=${CAMERA_RENTAL_DRUID_PASSWORD}
      - CAMERA_RENTAL_DRUID_ALLOW_IP=${CAMERA_RENTAL_DRUID_ALLOW_IP:-127.0.0.1}
      - TZ=Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: ${USER_SERVICE_REPLICAS:-1}
    networks:
      - camera-rental-network

  device-service:
    build:
      context: ./camera-rental-device-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - SENTINEL_DASHBOARD=sentinel:8858
      - CAMERA_RENTAL_DB_PASSWORD=${CAMERA_RENTAL_DB_PASSWORD}
      - CAMERA_RENTAL_JWT_SECRET=${CAMERA_RENTAL_JWT_SECRET}
      - CAMERA_RENTAL_RABBITMQ_USER=${CAMERA_RENTAL_RABBITMQ_USER}
      - CAMERA_RENTAL_RABBITMQ_PASSWORD=${CAMERA_RENTAL_RABBITMQ_PASSWORD}
      - CAMERA_RENTAL_MINIO_ACCESS_KEY=${CAMERA_RENTAL_MINIO_ACCESS_KEY}
      - CAMERA_RENTAL_MINIO_SECRET_KEY=${CAMERA_RENTAL_MINIO_SECRET_KEY}
      - CAMERA_RENTAL_REDIS_PASSWORD=${CAMERA_RENTAL_REDIS_PASSWORD}
      - CAMERA_RENTAL_DRUID_USERNAME=${CAMERA_RENTAL_DRUID_USERNAME}
      - CAMERA_RENTAL_DRUID_PASSWORD=${CAMERA_RENTAL_DRUID_PASSWORD}
      - CAMERA_RENTAL_DRUID_ALLOW_IP=${CAMERA_RENTAL_DRUID_ALLOW_IP:-127.0.0.1}
      - TZ=Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: ${DEVICE_SERVICE_REPLICAS:-1}
    networks:
      - camera-rental-network

  order-service:
    build:
      context: ./camera-rental-order-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - SENTINEL_DASHBOARD=sentinel:8858
      - CAMERA_RENTAL_DB_PASSWORD=${CAMERA_RENTAL_DB_PASSWORD}
      - CAMERA_RENTAL_JWT_SECRET=${CAMERA_RENTAL_JWT_SECRET}
      - CAMERA_RENTAL_RABBITMQ_USER=${CAMERA_RENTAL_RABBITMQ_USER}
      - CAMERA_RENTAL_RABBITMQ_PASSWORD=${CAMERA_RENTAL_RABBITMQ_PASSWORD}
      - CAMERA_RENTAL_MINIO_ACCESS_KEY=${CAMERA_RENTAL_MINIO_ACCESS_KEY}
      - CAMERA_RENTAL_MINIO_SECRET_KEY=${CAMERA_RENTAL_MINIO_SECRET_KEY}
      - CAMERA_RENTAL_REDIS_PASSWORD=${CAMERA_RENTAL_REDIS_PASSWORD}
      - CAMERA_RENTAL_DRUID_USERNAME=${CAMERA_RENTAL_DRUID_USERNAME}
      - CAMERA_RENTAL_DRUID_PASSWORD=${CAMERA_RENTAL_DRUID_PASSWORD}
      - CAMERA_RENTAL_DRUID_ALLOW_IP=${CAMERA_RENTAL_DRUID_ALLOW_IP:-127.0.0.1}
      - TZ=Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: ${ORDER_SERVICE_REPLICAS:-1}
    networks:
      - camera-rental-network

  coupon-service:
    build:
      context: ./camera-rental-coupon-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NACOS_ADDR=nacos:8848
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - SENTINEL_DASHBOARD=sentinel:8858
      - CAMERA_RENTAL_DB_PASSWORD=${CAMERA_RENTAL_DB_PASSWORD}
      - CAMERA_RENTAL_JWT_SECRET=${CAMERA_RENTAL_JWT_SECRET}
      - CAMERA_RENTAL_RABBITMQ_USER=${CAMERA_RENTAL_RABBITMQ_USER}
      - CAMERA_RENTAL_RABBITMQ_PASSWORD=${CAMERA_RENTAL_RABBITMQ_PASSWORD}
      - CAMERA_RENTAL_MINIO_ACCESS_KEY=${CAMERA_RENTAL_MINIO_ACCESS_KEY}
      - CAMERA_RENTAL_MINIO_SECRET_KEY=${CAMERA_RENTAL_MINIO_SECRET_KEY}
      - CAMERA_RENTAL_REDIS_PASSWORD=${CAMERA_RENTAL_REDIS_PASSWORD}
      - CAMERA_RENTAL_DRUID_USERNAME=${CAMERA_RENTAL_DRUID_USERNAME}
      - CAMERA_RENTAL_DRUID_PASSWORD=${CAMERA_RENTAL_DRUID_PASSWORD}
      - CAMERA_RENTAL_DRUID_ALLOW_IP=${CAMERA_RENTAL_DRUID_ALLOW_IP:-127.0.0.1}
      - TZ=Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: ${COUPON_SERVICE_REPLICAS:-1}
    networks:
      - camera-rental-network

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  camera-rental-network:
    driver: bridge

